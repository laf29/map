<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
    <title>Map Generator</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        background: #1f8fe0;
      }
      body { 
        margin: 0; 
      }
      #mapCanvas {
        display: block;
        margin: 0 auto;
        height: 80vh;
        width: 80vw;.
        display: inline;
      }
    </style>
  </head>
  <body style="background-color: #A88E67;">
    <canvas id="mapCanvas" style="height: 80vh; width: 80vw;" onmousedown="canvasClicked()">Your browser cannot support this game.</canvas>
    <script>
      const canvas = document.getElementById("mapCanvas");
      const ctx = canvas.getContext("2d");

     // Variables

      var GridX = 40;
      var GridY = 90;
      var density = GridX * GridY;
      var LandArray = [];
      var verticesX =[];
      var verticesY = [];
      var trueGridX = 500/GridX;// window.innerWidth/GridX;
      var trueGridY = 500/GridY;
      var k = 0;
      var m = 0;
     
     // Fill LandArray
      
      for (i = 0; i < density; i++) {
        let randLand = Math.floor(Math.random() * 2);
        if (randLand == 0) {
          LandArray[i] = "G";
        } else {
          LandArray[i] = "B";
        };
      };

     // Quasirandomness
      
      for (i = 0; i < density; i++) {
        n = i + 1;
        if (n % GridX == 0) {
          k++;
          m = 0;
        };
        randQX = Math.random() + m;
        randQY = Math.random() + k;
        verticesX[i] = randQX*trueGridX;
        verticesY[i] = randQY*trueGridY;
        m++;
      };


     // Draw

      function drawQuads(i) {
        n=i+1;
        if (n % GridX != 0) {
          ctx.beginPath();
          ctx.moveTo(verticesX[i], verticesY[i]);
          ctx.lineTo(verticesX[i+1], verticesY[i+1]);
          ctx.lineTo(verticesX[i+GridX+1], verticesY[i+GridX+1]);
          ctx.lineTo(verticesX[i+GridX], verticesY[i+GridX]);
          ctx.lineTo(verticesX[i], verticesY[i]);
          ctx.fill();
          ctx.closePath();
        };
      };

      for (i = 0; i < density - GridX-1; i++) {
        if (LandArray[i] == "B") {
          ctx.fillStyle = "#456789";
        } else if (LandArray[i] == "G") {
          ctx.fillStyle = "#345678";
        };
        drawQuads(i);
      };
    </script>
  </body>
</html>
